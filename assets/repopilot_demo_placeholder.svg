<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090A"/>
      <stop offset="50%" stop-color="#0F1011"/>
      <stop offset="100%" stop-color="#141516"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6AD2"/>
      <stop offset="100%" stop-color="#828FFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="180" r="240" fill="#5E6AD2" opacity="0.08" filter="url(#glow)"/>

  <!-- Browser Frame Mockup -->
  <g transform="translate(100, 60)">
    <rect width="1000" height="510" rx="16" fill="#0F1011" stroke="#23252A" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="1000" height="44" rx="16" fill="#141516"/>
    <path d="M0 28 h1000 v16 h-1000 z" fill="#141516"/>
    <circle cx="28" cy="22" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="44" cy="22" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="60" cy="22" r="5" fill="#10B981" opacity="0.8"/>

    <!-- Address Bar -->
    <rect x="250" y="10" width="500" height="24" rx="6" fill="#08090A" stroke="#23252A" stroke-width="1"/>
    <text x="500" y="26" fill="#8A8F98" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">
      https://repo-pilot-git.vercel.app/explore?owner=vercel&amp;repo=swr
    </text>

    <!-- App Header Inside Window -->
    <g transform="translate(30, 65)">
      <text x="0" y="24" fill="#F7F8F8" font-family="ui-monospace, monospace" font-size="18" font-weight="bold">
        RepoPilot
      </text>
      <text x="110" y="24" fill="#5E6AD2" font-family="ui-monospace, monospace" font-size="13">
        / vercel / swr
      </text>
      <rect x="800" y="6" width="140" height="26" rx="6" fill="#5E6AD2"/>
      <text x="870" y="23" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">
        Pinned: 5d80486f
      </text>
    </g>

    <!-- 3 Flow Step Cards Inside Mockup -->
    <!-- Card 1: Explorer & AST -->
    <g transform="translate(30, 120)">
      <rect width="295" height="340" rx="12" fill="#141516" stroke="#23252A" stroke-width="1"/>
      <rect x="15" y="15" width="265" height="32" rx="6" fill="#0F1011"/>
      <text x="25" y="36" fill="#828FFF" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">1. AST Code Explorer</text>
      
      <!-- Simulated File Tree -->
      <text x="25" y="75" fill="#62666D" font-family="ui-monospace, monospace" font-size="11">▼ src/</text>
      <text x="40" y="95" fill="#62666D" font-family="ui-monospace, monospace" font-size="11">▼ core/</text>
      <rect x="35" y="105" width="220" height="22" rx="4" fill="#5E6AD2" opacity="0.15"/>
      <text x="55" y="120" fill="#F7F8F8" font-family="ui-monospace, monospace" font-size="11">📄 use-swr.ts</text>
      <text x="40" y="145" fill="#62666D" font-family="ui-monospace, monospace" font-size="11">▶ utils/</text>
      <text x="40" y="165" fill="#62666D" font-family="ui-monospace, monospace" font-size="11">📄 index.ts</text>

      <!-- Symbol Chip -->
      <rect x="25" y="200" width="245" height="110" rx="8" fill="#08090A" stroke="#23252A"/>
      <text x="35" y="222" fill="#828FFF" font-family="ui-monospace, monospace" font-size="10">AST-Verified Symbol:</text>
      <text x="35" y="242" fill="#27A644" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">export function useSWR</text>
      <text x="35" y="262" fill="#8A8F98" font-family="ui-monospace, monospace" font-size="10">Line 45 - 88 · Scope: export</text>
      <text x="35" y="285" fill="#62666D" font-family="ui-monospace, monospace" font-size="9">Confidence: Tree-sitter AST (1.0)</text>
    </g>

    <!-- Card 2: 2D/3D Architecture -->
    <g transform="translate(350, 120)">
      <rect width="295" height="340" rx="12" fill="#141516" stroke="#23252A" stroke-width="1"/>
      <rect x="15" y="15" width="265" height="32" rx="6" fill="#0F1011"/>
      <text x="25" y="36" fill="#828FFF" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">2. Architecture Brief</text>

      <!-- Framework badges -->
      <rect x="25" y="65" width="115" height="22" rx="4" fill="#0F1011" stroke="#23252A"/>
      <text x="35" y="80" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="10">⚛️ React 18.3</text>
      <rect x="150" y="65" width="120" height="22" rx="4" fill="#0F1011" stroke="#23252A"/>
      <text x="160" y="80" fill="#F7F8F8" font-family="ui-monospace, monospace" font-size="10">▲ Next.js 14</text>

      <!-- Simulated 3D nodes -->
      <circle cx="147" cy="180" r="28" fill="#5E6AD2" opacity="0.3" stroke="#828FFF" stroke-width="1.5"/>
      <text x="147" y="184" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">root</text>

      <line x1="147" y1="152" x2="90" y2="230" stroke="#23252A" stroke-width="1.5"/>
      <line x1="147" y1="208" x2="205" y2="230" stroke="#23252A" stroke-width="1.5"/>

      <circle cx="90" cy="230" r="20" fill="#0F1011" stroke="#5E6AD2" stroke-width="1"/>
      <text x="90" y="233" fill="#828FFF" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">core</text>

      <circle cx="205" cy="230" r="20" fill="#0F1011" stroke="#27A644" stroke-width="1"/>
      <text x="205" y="233" fill="#27A644" font-family="ui-monospace, monospace" font-size="8" text-anchor="middle">utils</text>

      <!-- Toggle mode badge -->
      <rect x="25" y="280" width="245" height="30" rx="6" fill="#08090A" stroke="#23252A"/>
      <text x="147" y="299" fill="#8A8F98" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">
        Mode: 2D Schematic / 3D Canvas
      </text>
    </g>

    <!-- Card 3: Grounded Citations -->
    <g transform="translate(670, 120)">
      <rect width="300" height="340" rx="12" fill="#141516" stroke="#23252A" stroke-width="1"/>
      <rect x="15" y="15" width="270" height="32" rx="6" fill="#0F1011"/>
      <text x="25" y="36" fill="#828FFF" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">3. Grounded Q&amp;A Citations</text>

      <!-- Q Box -->
      <rect x="20" y="65" width="260" height="45" rx="6" fill="#08090A" stroke="#23252A"/>
      <text x="30" y="83" fill="#8A8F98" font-family="ui-monospace, monospace" font-size="10">Q: Where is cache mutation handled?</text>
      <text x="30" y="99" fill="#5E6AD2" font-family="ui-monospace, monospace" font-size="9">BYO Key / Local Ollama / Offline</text>

      <!-- A Box -->
      <rect x="20" y="125" width="260" height="110" rx="6" fill="#0F1011" stroke="#23252A"/>
      <text x="30" y="148" fill="#F7F8F8" font-family="ui-monospace, monospace" font-size="10">Cache mutation is implemented in</text>
      <text x="30" y="166" fill="#828FFF" font-family="ui-monospace, monospace" font-size="10" font-weight="bold">src/_internal/utils/mutate.ts</text>
      <text x="30" y="184" fill="#8A8F98" font-family="ui-monospace, monospace" font-size="10">broadcasting invalidation to hooks.</text>

      <!-- Citation Badge -->
      <rect x="30" y="200" width="200" height="22" rx="4" fill="#5E6AD2" opacity="0.2" stroke="#5E6AD2"/>
      <text x="38" y="215" fill="#828FFF" font-family="ui-monospace, monospace" font-size="9" font-weight="bold">
        ✓ [src/utils/mutate.ts:52-95#mutate]
      </text>

      <!-- Security Note -->
      <rect x="20" y="255" width="260" height="55" rx="6" fill="#08090A" stroke="#23252A"/>
      <text x="30" y="275" fill="#27A644" font-family="ui-monospace, monospace" font-size="9" font-weight="bold">✓ 100% Citation Validity Verified</text>
      <text x="30" y="295" fill="#62666D" font-family="ui-monospace, monospace" font-size="9">Untrusted code is never executed.</text>
    </g>
  </g>
</svg>
