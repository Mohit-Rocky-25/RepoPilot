<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient (For App Icon) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <!-- Subtle Radial Glow Behind Wings -->
    <radialGradient id="wingGlow" cx="256" cy="240" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <!-- Left Facet: Git Trunk Line / Port Delta Wing -->
    <linearGradient id="leftWing" x1="100" y1="80" x2="256" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Right Facet: Git Feature Branch / Starboard Delta Wing -->
    <linearGradient id="rightWing" x1="256" y1="80" x2="410" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Aft Keel: Git Merge Nexus / Supersonic Thrust Fin -->
    <linearGradient id="aftKeel" x1="256" y1="260" x2="256" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Center Guidance Beacon Core -->
    <linearGradient id="beaconCore" x1="230" y1="198" x2="282" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Drop Shadow for Dimensional Aerospace Depth -->
    <filter id="deltaShadow" x="40" y="40" width="432" height="432" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3B82F6" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Squircle Base for App Launcher Icon -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="510" height="510" rx="115" stroke="#1E283D" stroke-width="2" />

  <!-- Ambient Wing Glow -->
  <circle cx="256" cy="240" r="200" fill="url(#wingGlow)" />

  <g filter="url(#deltaShadow)">
    <!-- Port Wing (Git Trunk / Left Wing) -->
    <path d="M256 68 L100 354 L208 322 L256 220 Z" fill="url(#leftWing)" />

    <!-- Starboard Wing (Git Branch / Right Wing) -->
    <path d="M256 68 L256 220 L304 322 L412 354 Z" fill="url(#rightWing)" />

    <!-- Aft Keel (Merge Fin / Thrust Exhaust) -->
    <path d="M256 266 L304 322 L256 444 L208 322 Z" fill="url(#aftKeel)" />

    <!-- Central Guidance Beacon / Git Commit Core -->
    <circle cx="256" cy="220" r="26" fill="#FFFFFF" />
    <circle cx="256" cy="220" r="14" fill="url(#beaconCore)" />

    <!-- Precision Branch Anchor Terminals -->
    <circle cx="100" cy="354" r="12" fill="#60A5FA" />
    <circle cx="100" cy="354" r="5" fill="#FFFFFF" />

    <circle cx="412" cy="354" r="12" fill="#93C5FD" />
    <circle cx="412" cy="354" r="5" fill="#FFFFFF" />
  </g>
</svg>