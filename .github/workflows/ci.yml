name: CI & Quality Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Verify Types, Lint, Tests, Build & Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Secret Scan
        run: npm run security:scan

      - name: Verify Semantic Theme Tokens & Contrast
        run: npm run theme:check

      - name: Run Dependency Audit (Fail on High Severity)
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Suite & E2E Smoke Tests
        run: npm test

      - name: Run Retrieval Benchmark Eval
        run: npm run eval

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright End-to-End Tests
        run: npm run test:e2e

      - name: Run Next.js Production Build
        run: npm run build
