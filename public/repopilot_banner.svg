<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090A" />
      <stop offset="50%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#090A0D" />
    </linearGradient>

    <!-- Accent Glow -->
    <linearGradient id="glowGrad" x1="600" y1="0" x2="600" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E6AD2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#5E6AD2" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="300" y1="120" x2="700" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#828FFF" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#5E6AD2" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232733" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowGrad)" />

  <!-- Subtle Radial Glow behind logo -->
  <circle cx="600" cy="110" r="180" fill="#5E6AD2" fill-opacity="0.08" filter="blur(40px)" />

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" stroke="#232631" stroke-width="1" />

  <!-- Abstract 3D Architecture Graph Background Elements (Left & Right) -->
  <g opacity="0.4">
    <!-- Left Graph Cluster -->
    <line x1="80" y1="180" x2="160" y2="120" stroke="#5E6AD2" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="160" y1="120" x2="220" y2="200" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="160" y1="120" x2="120" y2="260" stroke="#828FFF" stroke-width="1.5" />
    <circle cx="80" cy="180" r="6" fill="#1E1B4B" stroke="#828FFF" stroke-width="2" />
    <circle cx="160" cy="120" r="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <circle cx="220" cy="200" r="5" fill="#022C22" stroke="#27A644" stroke-width="2" />
    <circle cx="120" cy="260" r="5" fill="#312E81" stroke="#A855F7" stroke-width="2" />

    <!-- Right Graph Cluster -->
    <line x1="1040" y1="140" x2="1120" y2="200" stroke="#5E6AD2" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="980" y1="220" x2="1040" y2="140" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="1040" y1="140" x2="1080" y2="80" stroke="#27A644" stroke-width="1.5" />
    <circle cx="1040" cy="140" r="8" fill="#1E1B4B" stroke="#828FFF" stroke-width="2" />
    <circle cx="1120" cy="200" r="6" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <circle cx="980" cy="220" r="5" fill="#312E81" stroke="#A855F7" stroke-width="2" />
    <circle cx="1080" cy="80" r="5" fill="#022C22" stroke="#27A644" stroke-width="2" />
  </g>

  <!-- Central Brand Icon (Compass / Navigation Node) -->
  <g transform="translate(568, 48)">
    <rect width="64" height="64" rx="16" fill="#13151D" stroke="#34394B" stroke-width="1.5" />
    <!-- Node Diamond -->
    <polygon points="32,16 48,32 32,48 16,32" fill="none" stroke="#5E6AD2" stroke-width="2.5" />
    <circle cx="32" cy="32" r="5" fill="#38BDF8" />
    <!-- Ray Accents -->
    <line x1="32" y1="10" x2="32" y2="14" stroke="#828FFF" stroke-width="2" stroke-linecap="round" />
    <line x1="32" y1="50" x2="32" y2="54" stroke="#828FFF" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="32" x2="14" y2="32" stroke="#828FFF" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="32" x2="54" y2="32" stroke="#828FFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Title: REPOPILOT -->
  <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="4" fill="url(#textGrad)">
    REPO<tspan fill="#828FFF">PILOT</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
    Autonomous Codebase Intelligence, 3D Architecture Visualizer &amp; Grounded Debugging
  </text>

  <!-- Live Deployment Link Pill (Center) -->
  <g transform="translate(420, 244)">
    <rect width="360" height="38" rx="19" fill="#131622" stroke="#5E6AD2" stroke-width="1.2" />
    <!-- Glowing Green Status Dot -->
    <circle cx="24" cy="19" r="4.5" fill="#22C55E" />
    <circle cx="24" cy="19" r="8" fill="#22C55E" fill-opacity="0.25" />
    <!-- Link Text -->
    <text x="44" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" fill="#F8FAFC">
      repo-pilot-git.vercel.app
    </text>
    <!-- Arrow -->
    <text x="328" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#828FFF">
      →
    </text>
  </g>

  <!-- Capability Badges along Bottom -->
  <g transform="translate(600, 318)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">
    <text x="-360">🌐 3D Spatial Maps</text>
    <text x="-180">📊 GitHub Mermaid.js</text>
    <text x="0">⚡ AST Symbol Indexing</text>
    <text x="180">🐛 Evidence Debugger</text>
    <text x="360">₹0 Zero API Costs</text>
  </g>
</svg>
