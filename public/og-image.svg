      <path d="M256 68 L256 220 L304 322 L412 354 Z" fill="#60A5FA" />
      <path d="M256 266 L304 322 L256 444 L208 322 Z" fill="#818CF8" />
      <circle cx="256" cy="220" r="26" fill="#FFFFFF" />
      <circle cx="256" cy="220" r="14" fill="#0284C7" />
      <circle cx="100" cy="354" r="12" fill="#60A5FA" />
      <circle cx="412" cy="354" r="12" fill="#93C5FD" />
    </g>
