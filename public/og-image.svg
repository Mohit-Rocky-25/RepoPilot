  <circle cx="600" cy="240" r="450" fill="url(#ogGlow)" />
  <rect x="1" y="1" width="1198" height="628" rx="20" stroke="#1E2638" stroke-width="2" />

  <!-- Central Aerospace Delta & Git Branch Mark -->
  <g transform="translate(540, 100)">
    <rect width="120" height="120" rx="28" fill="#0E131F" stroke="#25324B" stroke-width="2" />
    <g transform="translate(10, 10) scale(0.195)">
