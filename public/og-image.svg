    </pattern>
    <linearGradient id="titleGrad" x1="400" y1="280" x2="800" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
