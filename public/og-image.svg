    REPO<tspan fill="#60A5FA">PILOT</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="356" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="-0.2">
